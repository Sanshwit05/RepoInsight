[project]
name = "repoinsight"
version = "0.1.0"
description = "Intelligent Repository Health Analysis and Contribution Impact Prediction"
readme = "README.md"
requires-python = ">=3.10, <3.11"
authors = [
    { name = "RepoInsight Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "loguru>=0.7.2",
    "gitpython>=3.1.43",
    "pydriller>=2.6",
    "networkx>=3.4.2",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "torch>=2.14.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
